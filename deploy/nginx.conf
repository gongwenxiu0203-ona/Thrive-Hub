# ============================================================
#  Nginx 配置 — Thrive Hub 联盟营销管理系统
#  部署路径：/etc/nginx/conf.d/thrive-hub.conf
#  ⚠️  将 your-domain.com 替换为实际域名（含备案）
# ============================================================

# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name your-domain.com www.your-domain.com;

    # 腾讯云 HTTPS 证书验证路径（Let's Encrypt 或腾讯云 SSL）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主配置
server {
    listen 443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # ── SSL 证书（腾讯云免费 SSL / Let's Encrypt）──────────
    ssl_certificate     /etc/nginx/ssl/your-domain.com.pem;
    ssl_certificate_key /etc/nginx/ssl/your-domain.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── 安全响应头 ──────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── 上传文件大小限制 ────────────────────────────────────
    client_max_body_size 50M;

    # ── 静态资源缓存（Next.js _next/static）────────────────
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000/_next/static/;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── 上传文件直接返回（不走 Next.js）────────────────────
    location /uploads/ {
        alias /var/www/thrive-hub/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        # 禁止列目录
        autoindex off;
    }

    # ── Next.js 主应用（端口 3000）─────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # 超时设置（文件上传等耗时操作）
        proxy_read_timeout    300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
    }

    # ── 预留：未来独立 Node.js 服务（端口 3001）────────────
    # location /api/v2/ {
    #     proxy_pass http://127.0.0.1:3001;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }

    # ── 日志 ────────────────────────────────────────────────
    access_log /var/log/nginx/thrive-hub.access.log;
    error_log  /var/log/nginx/thrive-hub.error.log warn;
}
