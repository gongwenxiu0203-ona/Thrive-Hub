# ============================================================
#  Nginx 配置 — Thrive Hub (thraivehub.com)
#  部署路径：/etc/nginx/conf.d/thrive-hub.conf
# ============================================================

# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name thraivehub.com www.thraivehub.com;

    # SSL 证书续期验证路径（Let's Encrypt 用）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主配置
server {
    listen 443 ssl http2;
    server_name thraivehub.com www.thraivehub.com;

    # ── SSL 证书 ───────────────────────────────────────────────
    ssl_certificate     /etc/nginx/ssl/thraivehub.com.pem;
    ssl_certificate_key /etc/nginx/ssl/thraivehub.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── 安全响应头 ──────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── 上传文件大小限制 ────────────────────────────────────
    client_max_body_size 50M;

    # ── 静态资源缓存（Next.js _next/static）────────────────
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000/_next/static/;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── 上传文件直接返回（不走 Next.js）────────────────────
    location /uploads/ {
        alias /root/www/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        autoindex off;
    }

    # ── Next.js 主应用（端口 3000）─────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout    300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
    }

    # ── 日志 ────────────────────────────────────────────────
    access_log /var/log/nginx/thrive-hub.access.log;
    error_log  /var/log/nginx/thrive-hub.error.log warn;
}
